plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.2'
	id 'net.ltgt.errorprone' version '5.1.1'
	id 'org.openapi.generator' version '7.25.0'
}

group = 'com.ds'
version = '1.0.0'
description = 'live-test'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/openapi/src/main/java"
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	errorprone 'com.google.errorprone:error_prone_core:2.42.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	def localEnvFile = rootProject.file('.env.local')
	if (localEnvFile.exists()) {
		localEnvFile.readLines().each { line ->
			def trimmed = line.trim()
			if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) {
				return
			}

			def separatorIndex = trimmed.indexOf('=')
			def key = trimmed.substring(0, separatorIndex).trim()
			def value = trimmed.substring(separatorIndex + 1).trim()
			if (key && value && !System.getenv().containsKey(key)) {
				environment key, value
			}
		}
	}
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/src/main/resources/openapi/openapi.yaml"
	outputDir = "$buildDir/generated/openapi"
	apiPackage = 'com.ds.livetest.generated.api'
	modelPackage = 'com.ds.livetest.generated.dto'
	importMappings = [
		ApiEnvelope: 'com.ds.livetest.support.response.ApiEnvelope',
		ErrorResponse: 'com.ds.livetest.support.response.ErrorResponse',
		FieldErrorResponse: 'com.ds.livetest.support.response.FieldErrorResponse'
	]
	configOptions = [
		interfaceOnly: 'true',
		generateJsonIncludeAnnotations: 'false',
		generateJsonSetterNullsAnnotations: 'false',
		library: 'spring-boot',
		openApiNullable: 'false',
		requestMappingMode: 'api_interface',
		skipDefaultInterface: 'true',
		useResponseEntity: 'true',
		useSpringBoot4: 'true',
		useTags: 'true'
	]
	globalProperties = [
		apis: '',
		models: '',
		supportingFiles: 'false'
	]
}

tasks.named('openApiGenerate') {
	doFirst {
		delete "$buildDir/generated/openapi"
	}
}

openApiValidate {
	inputSpec = "$rootDir/src/main/resources/openapi/openapi.yaml"
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('check') {
	dependsOn tasks.named('openApiValidate')
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat('1.28.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
